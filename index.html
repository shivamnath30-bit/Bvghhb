<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ham ek dusre ko Pasand karte hai</title>
    <style>
        /* Blended Background: Yellow and Saffron (#FF9933) */
        body {
            background: linear-gradient(135deg, yellow, #ff9933);
            color: deeppink;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* Top Header Container */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        /* Top Left: Profile Pic Saving Frame */
        .top-left-frame {
            border: 2px dashed deeppink;
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 8px;
            width: 200px;
        }

        .top-left-frame p {
            margin: 0 0 10px 0;
            font-weight: bold;
            color: red;
            text-align: center;
        }

        .top-left-frame input {
            width: 100%;
            margin-bottom: 8px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid deeppink;
            border-radius: 4px;
        }

        /* Top Right: Phone and Blinking Name */
        .top-right-info {
            text-align: right;
            font-size: 1.2em;
            color: deeppink;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid deeppink;
        }

        /* Blinking Animation */
        .blink-text {
            animation: blinker 1s linear infinite;
            color: red;
            font-size: 1.3em;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Main Gradient Title */
        .main-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            /* Gradient blend of Red, Blue, and Green */
            background: linear-gradient(to right, red, blue, green);
            -webkit-background-clip: text;
            color: transparent;
            margin: 10px 20px 30px 20px;
            line-height: 1.4;
        }

        /* Subheadings (Red) */
        h2 {
            color: red;
            text-align: center;
            text-decoration: underline;
        }

        /* Layout Container for Side-by-Side forms */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        /* Individual Form Sections */
        .form-section {
            background-color: rgba(255, 255, 255, 0.5); 
            border: 2px solid deeppink;
            border-radius: 10px;
            padding: 20px;
            width: 45%;
            box-sizing: border-box;
            min-width: 320px;
        }

        /* Input Labels and Fields (Pink overall theme for text) */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: deeppink;
        }

        input[type="text"], 
        input[type="date"], 
        input[type="number"],
        input[type="tel"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid deeppink;
            border-radius: 4px;
            box-sizing: border-box;
            color: #333;
        }

        /* Frames for File Uploads */
        .upload-frame {
            border: 2px dashed deeppink;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 20px;
            margin-top: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .upload-frame p {
            margin: 0 0 10px 0;
            font-weight: bold;
            color: red;
        }

        /* Submit Button Styling */
        .submit-btn {
            display: block;
            width: 250px;
            margin: 40px auto;
            padding: 15px;
            background-color: red;
            color: yellow;
            border: 2px solid deeppink;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
